# Website configuration. Build with:
#   python3 scripts/build_index.py && python3 scripts/build_site.py && mkdocs serve
# build/nav.yml is generated by scripts/build_site.py.
INHERIT: build/nav.yml

site_name: Our Old World
site_description: Pre-1900 buildings seen two ways - the story we are told, and the alternative.
site_url: https://ourold.world/
repo_url: https://github.com/martinv678/our-old-world
repo_name: martinv678/our-old-world
edit_uri: ""

docs_dir: build/docs
site_dir: build/site

theme:
  name: material
  language: en
  icon:
    logo: material/castle
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: brown
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      zoomable: true
      draggable: true

markdown_extensions:
  - tables
  - attr_list
  - admonition
  - toc:
      permalink: true
  - pymdownx.magiclink
  - pymdownx.superfences
  - md_in_html

not_in_nav: |
  /places/**/images/**
  /media/images/**
