name: Update glossary

on:
  push:
    branches: [main]
    paths:
      - "places/**"
      - "GLOSSARY.md"
      - "scripts/build_glossary.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Rebuild glossary
        run: python3 scripts/build_glossary.py
      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "Glossary already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add GLOSSARY.md places
          git commit -m "Update glossary"
          git push
